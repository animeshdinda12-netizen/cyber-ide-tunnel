<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cyber IDE - Backendless Web Dev Studio</title>
  <meta name="description" content="Premium backendless web IDE + Browser Tunnel deployment platform. Single HTML or split component projects with service-worker powered tunnel previews." />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.525.0/dist/lucide.min.js"></script>
  <script crossorigin src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',
              400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',
              800:'#1e293b',900:'#0f172a',950:'#020617'
            },
            cyan: { 400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e738a' }
          }
        }
      }
    };
  </script>
  <link rel="icon" href="https://cdn.lucide.dev/icons/codesandbox.svg" />
  <script type="text/babel" data-presets="env,react,typescript">
    const { React, ReactDOM } = window;
    const useState = React.useState;
    const useEffect = React.useEffect;
    const useRef = React.useRef;
    const Fragment = React.Fragment;

    const STORAGE_KEY = "cyber-ide-projects";
    function loadProjects() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { return []; }
    }
    function saveProjects(list) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) { console.error("Storage quota", e); }
    }

    const EXPIRY_MS = 900000;
    const TUNNEL_BASE = (location.origin || "") + "/preview.html";

    const TEMPLATE = {
      html: '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8" />\n  <meta name="viewport" content="width=device-width, initial-scale=1" />\n  <title>My App</title>\n  <style>\n    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: grid; place-items: center; height: 100vh; }\n    h1 { font-size: 2rem; }\n  </style>\n</head>\n<body>\n  <h1>🚀 Welcome to Cyber IDE</h1>\n</body>\n</html>\n',
      css: "/* Add your styles here */\nbody { margin: 0; }\n",
      js: "// Add your interactivity here\nconsole.log('Hello from Cyber IDE');\n"
    };

    // Lucide icon helper with graceful fallback to inline SVG
    const LUC = (typeof window !== "undefined" && window.lucide) || {};
    const ICON_PATHS = {
      Plus:"M12 5v14m7-7H5", ArrowLeft:"M19 12H5m7 7-7-7 7-7",
      Folder:"M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H8L5 7z",
      Edit2:"M17 3a2.85 2.85 0 1 1 4 4L7.5 19.5 1 21l1.5-5.5L17 3z",
      Trash2:"M3 6h18M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1h2z M4 6h16v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z",
      Download:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4",
      Upload:"M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 10l5 5 5-5",
      Save:"M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l4 4h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2z",
      X:"M18 6 6 18M6 6l12 12", Code:"M9.5 18l6.5-6.5-6.5-6.5",
      Server:"M12 2a5 5 0 0 0-5 5v4a5 5 0 0 0 10 0 0V7a5 5 0 0 0-5-5zm0 6v7m5 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z",
      Copy:"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2",
      Rocket:"M4 13.5v-3a1 1 0 0 0-.5-1l7-3.5a1 1 0 0 1 1.5 0l7 3.5a1 1 0 0 1 .5 1v3a1 1 0 0 1-.5 1l-7 3.5a1 1 0 0 1-1 0L4.5 14.5a1 1 0 0 1-.5-1v0z",
      ExternalLink:"M18 13v-2a4 4 0 0 0-3.8-4H8v14h6.5a4 4 0 0 0 3.5-3.5V13z",
      Layout:"M8 5v14M12 5v14m4-14v14M4 9h16M4 13h16",
      AlertCircle:"M10.29 3.86A1 1 0 0 1 11.7 3h.6a1 1 0 0 1 .97.84L14 10h-2v2h2v6h-6v-2h2v-6H4.3z",
      FileText:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"
    };
    const _cache = {};
    function Icon({ name, className = "w-5 h-5", style }) {
      if (!_cache[name]) {
        let Cmp = null;
        try { if (LUC && LUC.createLucideIcon) Cmp = LUC.createLucideIcon(ICON_PATHS[name]); } catch { Cmp = null; }
        _cache[name] = Cmp;
      }
      if (_cache[name]) {
        const Cmp = _cache[name];
        return React.createElement(Cmp, { className, style, size: 16 });
      }
      return (
        <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
          <path d={ICON_PATHS[name] || ""} />
        </svg>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
              <div className="bg-slate-900/90 backdrop-blur-md border border-red-500/40 rounded-xl p-8 max-w-lg text-center">
                <Icon name="AlertCircle" className="w-12 h-12 text-red-400 mx-auto mb-4" />
                <h2 className="text-xl font-bold text-red-300 mb-2">Something went wrong</h2>
                <p className="text-slate-400 text-sm mb-4">{String(this.state.error && this.state.error.message)}</p>
                <button className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg transition-colors" onClick={() => location.reload()}>Reload Application</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [projects, setProjects] = useState([]);
      const [view, setView] = useState("dashboard");
      const [current, setCurrent] = useState(null);
      const [content, setContent] = useState({ html: "", css: "", js: "" });
      const [tunnel, setTunnel] = useState(null);
      const [tunnelTime, setTunnelTime] = useState(900);

      useEffect(() => {
        setProjects(loadProjects());
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/sw.js", { scope: "/", type: "module" })
            .then(() => navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({ type: "PING" }))
            .catch((e) => console.warn("SW registration fallback:", e));
        }
      }, []);

      const persist = (proj) => {
        const list = loadProjects().map(p => p.id === proj.id ? proj : p);
        if (!list.some(p => p.id === proj.id)) list.push(proj);
        saveProjects(list);
        setProjects([...list]);
      };

      const handleNew = (structure, name, fileContent) => {
        const proj = {
          id: "p_" + Date.now(),
          name: name || "Untitled Project",
          type: structure,
          createdAt: new Date().toISOString(),
          content: structure === "single"
            ? { html: fileContent || TEMPLATE.html, css: "", js: "" }
            : { html: TEMPLATE.html, css: TEMPLATE.css, js: TEMPLATE.js }
        };
        persist(proj);
        setCurrent(proj);
        setContent(proj.content);
        setView("ide");
      };

      const openProject = (proj) => { setCurrent(proj); setContent(proj.content); setView("ide"); };
      const renameProject = (proj, newName) => { proj.name = newName; persist(proj); setCurrent({ ...proj }); };
      const deleteProject = (id) => { const list = projects.filter(p => p.id !== id); saveProjects(list); setProjects(list); };

      const downloadProject = (proj) => {
        if (!proj) return;
        if (proj.type === "single") {
          const blob = new Blob([proj.content.html || ""], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = (proj.name || "project") + ".html"; a.click();
          URL.revokeObjectURL(url);
        } else {
          const JSZip = (window.JSZip || null);
          if (!JSZip) { alert("Multi-file download requires JSZip (loading remote)."); loadJSZipDownload(proj); return; }
          const doc = JSZip();
          doc.file("index.html", proj.content.html || "");
          doc.file("style.css", proj.content.css || "");
          doc.file("script.js", proj.content.js || "");
          doc.file("README.md", "# " + proj.name);
          doc.generateAsync({ type: "blob" }).then(b => {
            const url = URL.createObjectURL(b);
            const a = document.createElement("a");
            a.href = url; a.download = proj.name + ".zip"; a.click();
            URL.revokeObjectURL(url);
          });
        }
      };

      const updateContent = (c) => {
        setContent(c);
        const p = { ...current, content: c };
        persist(p);
        setCurrent(p);
      };

      const clearPane = (pane) => { const c = { ...content, [pane]: "" }; updateContent(c); };
      const removeTemplate = () => { updateContent({ html: "", css: "", js: "" }); };

      const spinUpTunnel = () => {
        const raw = JSON.stringify(current.content);
        let compressed = "";
        try { compressed = lzString.compressToEncodedURIComponent(raw); }
        catch { compressed = encodeURIComponent(raw).replace(/%/g, (m) => String.fromCharCode("0x" + m.slice(1))); }
        const exp = Date.now() + EXPIRY_MS;
        const url = TUNNEL_BASE + "?t=" + encodeURIComponent(compressed) + "&e=" + exp + "&n=" + encodeURIComponent(current.name || "project");
        setTunnel({ url, exp });
        setTunnelTime(900);
      };

      const revokeTunnel = () => { setTunnel(null); setTunnelTime(900); };
      const copyLink = async () => {
        try { await navigator.clipboard.writeText(tunnel.url); alert("Copied to clipboard!"); }
        catch { prompt("Copy this link:", tunnel.url); }
      };

      useEffect(() => {
        if (!tunnel) return;
        const iv = setInterval(() => {
          const r = Math.max(0, Math.floor((tunnel.exp - Date.now()) / 1000));
          setTunnelTime(r);
          if (r <= 0) revokeTunnel();
        }, 1000);
        return () => clearInterval(iv);
      }, [tunnel]);

      const renderDashboard = () => (
        <div className="flex-1 overflow-auto">
          <div className="max-w-4xl mx-auto p-6">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold text-white">Cyber IDE</h1>
              <button className="btn-cyan" onClick={() => setView("new")}>
                <Icon name="Plus" className="w-4 h-4 mr-2 inline" />New Project
              </button>
            </div>
            {projects.length === 0
              ? (<div className="text-center py-16">
                  <Icon name="FileText" className="w-16 h-16 mx-auto mb-4 text-slate-600" />
                  <h3 className="text-xl font-semibold text-slate-400 mb-2">No projects yet</h3>
                  <p className="text-slate-500 text-sm">Create a new project to get started</p>
                </div>)
              : (
                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {projects.map(p => (
                    <div key={p.id} className="card group">
                      <div className="p-4">
                        <div className="flex items-start justify-between mb-3">
                          <div className="flex-1 min-w-0">
                            <h3 className="font-bold text-white truncate">{p.name}</h3>
                            <p className="text-xs text-slate-500 mt-1">{new Date(p.createdAt).toLocaleDateString()}</p>
                          </div>
                          <span className="px-2 py-1 text-xs rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                            {p.type === "single" ? "Unified HTML" : "Split View"}
                          </span>
                        </div>
                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button className="btn-ghost flex-1" title="Open" onClick={() => openProject(p)}><Icon name="Folder" /></button>
                          <button className="btn-ghost flex-1" title="Download" onClick={() => downloadProject(p)}><Icon name="Download" /></button>
                          <button className="btn-ghost flex-1 text-red-400 hover:text-red-300" title="Delete"
                            onClick={() => { if (confirm("Delete " + p.name + "?")) deleteProject(p.id); }}>
                            <Icon name="Trash2" />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
          </div>
        </div>
      );

      const renderIDE = () => {
        if (!current) return null;
        const isSingle = current.type === "single";
        const tabs = isSingle ? ["Unified"] : ["HTML", "CSS", "JS"];
        const [activeTab, setActiveTab] = useState("html");

        const renderEditor = (pane) => (
          <textarea
            className="editor"
            value={content[pane] || ""}
            onChange={(e) => updateContent({ ...content, [pane]: e.target.value })}
            placeholder={pane === "html" ? "<!DOCTYPE html>..." : pane === "css" ? "/* styles */" : "// scripts"}
            spellCheck={false}
          />
        );

        const activePane = isSingle ? "html" : activeTab;
        return (
          <div className="flex flex-col h-screen bg-slate-950">
            <header className="header-glass flex items-center justify-between px-4 h-14 flex-shrink-0">
              <div className="flex items-center gap-3">
                <button className="btn-ghost" onClick={() => setView("dashboard")}><Icon name="ArrowLeft" className="w-4 h-4" /></button>
                <div className="flex items-center gap-2 group">
                  <input
                    className="text-lg font-semibold bg-transparent text-white border-b-2 border-transparent group-focus-within:border-cyan-500 focus:outline-none w-48"
                    value={current.name}
                    onChange={(e) => renameProject(current, e.target.value)}
                  />
                  <button className="opacity-0 group-hover:opacity-100 btn-ghost" title="Rename"
                    onClick={() => { const n = prompt("Project name:", current.name); if (n) renameProject(current, n); }}>
                    <Icon name="Edit2" className="w-4 h-4" />
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button className="btn-ghost" title="Clear pane" onClick={() => clearPane(activePane)}><Icon name="Trash2" /></button>
                <button className="btn-ghost" title="Remove template" onClick={removeTemplate}><Icon name="X" /></button>
                <button className="btn-ghost" title="Download" onClick={() => downloadProject(current)}><Icon name="Download" /></button>
                <button className="btn-cyan pulse" onClick={spinUpTunnel}>
                  <Icon name="Rocket" className="w-4 h-4 mr-2 inline" />Spin Up Tunnel
                </button>
              </div>
            </header>
            <div className="flex border-b border-slate-800">
              {tabs.map(t => {
                const val = t === "Unified" ? "html" : t.toLowerCase();
                const active = activePane === val;
                return (
                  <button
                    key={t}
                    className={"px-4 py-2 text-sm font-medium transition-colors " +
                      (active ? "border-cyan-500 text-cyan-400 bg-slate-800/50" : "border-transparent text-slate-400 hover:text-slate-300")}
                    onClick={() => setActiveTab(val)}
                  >{t}</button>
                );
              })}
            </div>
            <div className="flex-1 flex overflow-hidden">
              <div className="flex-1 overflow-auto">{renderEditor(activePane)}</div>
              {!isSingle && (
                <div className="w-1/2 border-l border-slate-800 overflow-auto">{renderEditor(activePane)}</div>
              )}
            </div>
          </div>
        );
      };

      const renderTunnelOverlay = () => {
        if (!tunnel) return null;
        const mins = String(Math.floor(tunnelTime / 60)).padStart(2, "0");
        const secs = String(tunnelTime % 60).padStart(2, "0");
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
            <div className="modal-glass p-6 rounded-xl max-w-md w-full mx-4">
              <div className="flex items-center justify-center mb-4">
                <div className="w-12 h-12 border-4 border-cyan-500/30 border-t-cyan-500 rounded-full animate-spin"></div>
              </div>
              <h3 className="text-xl font-bold text-center text-white mb-2">Tunnel Active!</h3>
              <p className="text-center text-cyan-400 font-mono mb-4">{mins}:{secs}</p>
              <div className="flex gap-2">
                <button className="btn-ghost flex-1" onClick={copyLink}>
                  <Icon name="Copy" className="w-4 h-4 mr-2 inline" />Copy Link
                </button>
                <a href={tunnel.url} target="_blank" rel="noopener noreferrer" className="btn-ghost flex-1">
                  <Icon name="ExternalLink" className="w-4 h-4 mr-2 inline" />Open Preview
                </a>
                <button className="btn-ghost text-red-400 hover:text-red-300 flex-1" onClick={revokeTunnel}>
                  <Icon name="X" className="w-4 h-4 mr-2 inline" />Kill Server
                </button>
              </div>
            </div>
          </div>
        );
      };

      const NewProjectModal = ({ onClose, onNext }) => {
        const [step, setStep] = useState(1);
        const [structure, setStructure] = useState("single");
        const [name, setName] = useState("My Project");
        const [fileContent, setFileContent] = useState("");
        const fileRef = useRef(null);
        const handleFile = (e) => { const f = e.target.files[0]; if (f) { f.text().then(setFileContent); } };
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
            <div className="modal-glass rounded-xl p-6 max-w-lg w-full mx-4">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-lg font-bold text-white">{step === 1 ? "Select Structure" : "Project Details"}</h3>
                <button className="btn-ghost" onClick={onClose}><Icon name="X" /></button>
              </div>
              {step === 1
                ? (<div className="flex gap-4">
                    <div className={"flex-1 card border-2 cursor-pointer transition-all " + (structure === "single" ? "border-cyan-500" : "border-slate-700")} onClick={() => setStructure("single")}>
                      <div className="p-4 text-center">
                        <Icon name="FileText" className="w-8 h-8 mx-auto mb-2 text-cyan-500" />
                        <div className="font-semibold text-white">Single Unified HTML File</div>
                        <p className="text-xs text-slate-400 mt-1">One clean .html document, everything inside</p>
                      </div>
                    </div>
                    <div className={"flex-1 card border-2 cursor-pointer transition-all " + (structure === "split" ? "border-cyan-500" : "border-slate-700")} onClick={() => setStructure("split")}>
                      <div className="p-4 text-center">
                        <Icon name="Layout" className="w-8 h-8 mx-auto mb-2 text-cyan-500" />
                        <div className="font-semibold text-white">Split Component View</div>
                        <p className="text-xs text-slate-400 mt-1">Separated HTML, CSS, JS panels</p>
                      </div>
                    </div>
                  </div>)
                : (<div className="space-y-4">
                    <input className="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:border-cyan-500 focus:outline-none"
                      value={name} onChange={(e) => setName(e.target.value)} placeholder="Project name" />
                    <div className="border-2 border-dashed border-slate-700 rounded-lg p-4 text-center cursor-pointer hover:border-cyan-500 transition-colors" onClick={() => fileRef.current && fileRef.current.click()}>
                      <input type="file" accept=".html,.css,.js,.txt" ref={fileRef} className="hidden" onChange={handleFile} />
                      <div className="flex flex-col items-center">
                        <Icon name="Upload" className="w-6 h-6 text-slate-500 mb-1" />
                        <span className="text-sm text-slate-400">
                          {fileContent ? (fileContent.slice(0, 30) + "...") : "Import code from local file (optional)"}
                        </span>
                      </div>
                    </div>
                  </div>)}
              <div className="flex justify-between mt-6">
                <button className="btn-ghost" onClick={onClose}>Cancel</button>
                {step === 1
                  ? <button className="btn-cyan" onClick={() => setStep(2)}>Next</button>
                  : <button className="btn-cyan" onClick={() => { onNext(structure, name, fileContent); onClose(); }}>Create Project</button>}
              </div>
            </div>
          </div>
        );
      };

      return (
        <Fragment>
          <ErrorBoundary>
            {view === "dashboard" && renderDashboard()}
            {view === "new" && <NewProjectModal onClose={() => setView("dashboard")} onNext={handleNew} />}
            {view === "ide" && renderIDE()}
          </ErrorBoundary>
          {renderTunnelOverlay()}
        </Fragment>
      );
    }

    function loadJSZipDownload(proj) {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
      s.onload = () => downloadProject(proj);
      s.onerror = () => alert("Could not load JSZip; multi-file download unavailable.");
      document.body.appendChild(s);
    }
  </script>
  <script>
    (function () {
      if (!document.getElementById("__cyber-styles")) {
        const s = document.createElement("style");
        s.id = "__cyber-styles";
        s.textContent = [
          ".header-glass { @apply bg-slate-900/80 backdrop-blur-md border-b border-slate-800/60; }",
          ".modal-glass { @apply bg-slate-900/90 backdrop-blur-md border border-slate-700/60; }",
          ".card { @apply bg-slate-900/50 border border-slate-800/60 rounded-lg hover:bg-slate-800/50 transition-all; }",
          ".btn-cyan { @apply px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition-colors text-sm font-medium; }",
          ".btn-ghost { @apply p-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg transition-colors; }",
          ".editor { @apply w-full min-h-[400px] bg-slate-900/30 border-0 text-slate-200 font-mono text-sm p-4 resize-none focus:ring-1 focus:ring-cyan-500/50; }",
          ".pulse { animation: pulse 2s ease-in-out infinite; }",
          "@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }",
          "@keyframes spin { to { transform: rotate(360deg); } }",
          ".animate-spin { animation: spin 1s linear infinite; }"
        ].join("\n");
        document.head.appendChild(s);
      }
    })();
  </script>
  <script>
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
